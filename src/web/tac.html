<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TAC</title>
  <link rel="stylesheet" href="/assets/shared/font.css">
  <link rel="stylesheet" href="/assets/shared/theme.css">
  <link rel="stylesheet" href="/assets/shared/lit-panel.css">
  <link rel="stylesheet" href="/ext/tac/tac.css">
</head>
<body>
  <div class="tac-page">
    <div class="tac-head">
      <span class="tac-title">TARGET CONTROL</span>
    </div>

    <div class="tac-bar">
      <span class="tac-count" id="count"></span>
      <span class="tac-flash" id="flash" aria-live="polite"></span>
      <button type="button" class="tac-btn tac-add" id="add-btn" aria-haspopup="dialog">ADD FROM MAP ▼</button>
    </div>

    <div class="tac-matrix" id="matrix"></div>

    <div class="tac-foot">
      <div class="tac-sel">
        <span class="tac-label">SELECTED</span>
        <span class="tac-sel-name" id="sel-name"></span>
        <span class="tac-label tac-sel-status-label">STATUS</span>
        <span class="tac-sel-status" id="sel-status"></span>
        <span class="tac-spacer"></span>
        <button type="button" class="tac-btn tac-locate" id="locate-btn">LOCATE</button>
        <button type="button" class="tac-btn tac-remove" id="remove-btn">REMOVE</button>
      </div>
      <div class="tac-pri-row">
        <span class="tac-label">PRIORITY</span>
        <div class="tac-pri-btns" id="pri-btns"></div>
      </div>
    </div>
  </div>

  <div class="tac-scrim" id="scrim" hidden></div>
  <div class="tac-pop" id="pop" role="dialog" aria-labelledby="pop-title" hidden>
    <div class="tac-pop-head"><span class="tac-pop-title" id="pop-title"></span><span class="tac-pop-sub" id="pop-sub"></span></div>
    <div class="tac-pop-list" id="pop-list"></div>
    <div class="tac-pop-foot">
      <button type="button" class="tac-btn tac-add" id="pop-all">ADD ALL</button>
      <button type="button" class="tac-btn" id="pop-close">CLOSE</button>
    </div>
  </div>

  <div class="mfd-empty" id="no-mission">
    <span class="mfd-empty-title">TAC</span>— NO SIGNAL —
  </div>

  <script src="/ext/tac/tac-board.js"></script>
  <script type="module" src="/ext/tac/tac.js"></script>
</body>
</html>
